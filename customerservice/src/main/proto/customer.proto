syntax = "proto3";


option java_multiple_files = true;
option java_package = "com.banking.grpc.customer";

package customer;

service CustomerGrpcService {
  rpc ValidateCustomer(CustomerValidationRequest)
      returns (CustomerValidationResponse);
}

message CustomerValidationRequest {
  int64 customerId = 1;
}

message CustomerValidationResponse {
  bool exists = 1;
}