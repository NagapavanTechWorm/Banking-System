syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.banking.grpc.account";

package account;

service AccountGrpcService {

  rpc ValidateAccount(AccountValidationRequest)
      returns (AccountValidationResponse);

  rpc UpdateAccount(AccountUpdateRequest)
        returns (AccountUpdateResponse);

}

message AccountValidationRequest {
  int64 accountNumber = 1;
  int64 customerId = 2;
}

message AccountValidationResponse {
  bool exists = 1;
}

message AccountUpdateRequest {
  int64 accountNumber = 1;
  double amount = 2;
  string transactionType = 3;
}

message AccountUpdateResponse {
  bool success = 1;
  double updatedBalance = 2;
  string errorMessage = 3;
}